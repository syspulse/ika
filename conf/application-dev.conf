include "default-core"
include "default-http"
include "default-rpc3"

http {
  routes {
    ask-timeout = 15s
  }

  port=8080
}

akka.http.server.parsing.illegal-header-warnings = off
akka.http.parsing.max-chunk-size = 10m

# ================================================================================================

solana_prod {
  type="rpc3://"
  chain="solana"
  strategy="cache_async"
  ttl=10000
  latest=1000
  gc=5000
}

pool_solana {
  type="pool://"
  strategy="sticky"
  destinations = [
    ${?SOL_RPC_URL}
  ]
}

retry_prod {
  type="retry://"
  maxRetries=3
  delay=1000
}

http_prod {
  type="http://"
  connectTimeout=3000
  responseTimeout=13000
}

profiles {
  solana = {
    processors = "solana_prod, pool_solana, retry_prod, http_prod"
  }
}
