include "default-core"
include "default-http"

http {
  routes {
    ask-timeout = 15s
  }
}

http {
  port=8080
}

akka.http.server.parsing.illegal-header-warnings = off
akka.http.parsing.max-chunk-size = 10m


#datastore="none://"

# ---- Pipeline -------------------------------------------------

processors="throttle_1, pool_1, http_1"

throttle_1 {
  type="throttle://"
  throttle = 3000
}

http_1 {
  type="http://"
  method = "GET"
  headers = {
    "Content-Type" = "application/json"
  }  
}

pool_1 {
  type="pool://"
  strategy="lb"
  destinations = [
    "host1=http://localhost:8300",
    "host2=http://localhost:8301"
  ]
}

cache_1 {
  type="cache://"
  strategy="expire"
  gc=60000
  ttl=1000
}

# ===================================================================================
# proxy
# ===================================================================================
pool_2 {
  type="pool://"
  strategy="sticky"
  #strategy="rr"
  destinations = ["http://localhost:8300","http://localhost:8301"]
}

http_2 {
  type="http://"
  connectTimeout=1000
  responseTimeout=3000
}

header_1 {
  type="header://"
  removeRequest = ["host", "timeout-access"]  
}

header_2 {
  type="header://"
  removeRequest = ["host", "timeout-access"]
  addRequest = {
    "Content-Type" = "application/json"
  }
}

reject_2 {
  type="reject://"
  httpStatusCode=400
}

retry_2 {
  type="retry://"
  maxRetries=3
  delay=1000
}

cache_2 {
  type="cache://"
  strategy="expire"
  gc=60000
  ttl=5000
}

throttle_2 {
  type="throttle://"
  throttle=3000
  tps=2
}

# ===================================================================================
# RPC3 Proxy
# ===================================================================================
rpc3_1 {
  type="rpc3://"
  strategy="expire"
  gc=60000
  ttl=5000
  latest=1000
}

pool_3 {
  type="pool://"
  #strategy="sticky"
  strategy="rr"
  destinations = [
    "https://ethereum-rpc.publicnode.com",
    "https://gateway.tenderly.co/public/mainnet",
    "https://rpc.ankr.com/eth"
  ]
}

# ===================================================================================
# AI Router
# ===================================================================================
ai_router_1 {
  type="ai_router://"
  providers = {
    "openai" {
      uri="https://api.openai.com"
      api_key=${?OPENAI_API_KEY}
      api_key_header_name="Authorization"
      api_key_header_value="Bearer %s"
    }
    "claude" {
      uri="https://api.claude.com"
      api_key=${?CLAUDE_API_KEY}
      api_key_header_name="x-api-key"
      api_key_header_value="%s"
    }
  }
}

# =========================================================================================
# Profiles
# =========================================================================================
profiles {
  ai_router = {
    processors = "ai_router_1, http_2"
  }

  proxy = {
    processors = "throttle_2, cache_2, pool_2, header_2, retry_2, http_2"
  }

  proxy2 = {
    processors = "pool_1, http_2"
  }

  proxy3 = {
    processors = "header_1, pool_1, retry_2, http_2"
  }

  rpc3 = {
    processors = "rpc3_1, pool_2, retry_2, http_2"
  }

  rpc3_ethereum = {
    processors = "rpc3_1, pool_3, retry_2, http_2"
  }
}
