include "default-core"
include "default-http"

http {
  routes {
    ask-timeout = 15s
  }
}

http {
  port=8080
}

akka.http.server.parsing.illegal-header-warnings = off
akka.http.parsing.max-chunk-size = 10m

# ---------------------------------------------------------------- 
# Secrets
# ----------------------------------------------------------------
secrets {
  SOL_RPC = {
    name = "sol-qn1"
    tags = ["solana","qn"]
    secret = ${?SOL_RPC_URL}
  }

  
}

#datastore="none://"

# ---- Pipeline -------------------------------------------------

processors="throttle_1, pool_1, http_1"

throttle_1 {
  type="throttle://"
  throttle = 3000
}

http_proxy {
  type="http://"  
}

http_1 {
  type="http://"
  method = "GET"
  headers = {
    "Content-Type" = "application/json"
  }  
}

pool_1 {
  type="pool://"  
  destinations = [
    "host1=http://localhost:8300",    
  ]
}

cache_1 {
  type="cache://"
  strategy="cache"
  gc=60000
  ttl=1000
}

# ===================================================================================
# Proxies
# ===================================================================================
proxy_1 {
  type="proxy://"
  scheme="http"
  addVia=true
  viaValue="1.1 ika-proxy"
}

# ===================================================================================
# Pools
# ===================================================================================
pool_2 {
  type="pool://"
  strategy="sticky"
  #strategy="rr"
  destinations = ["http://localhost:8300","http://localhost:8301"]
}

pool_3 {
  type="pool://"
  strategy="rr"
  destinations = ["http://localhost:8300","http://localhost:8301"]
}

http_0 {
  type="http://"
  connectTimeout=1000
  responseTimeout=125
}

http_2 {
  type="http://"
  connectTimeout=1000
  responseTimeout=3000
}

http_ai {
  type="http://"
  connectTimeout=1000
  responseTimeout=11000
}

ai_token_1 {
  type="ai_token://"
  # Template for per-request metadata telemety attribute name (see AITokensProcessor).
  metadataUsageAttr="tid,pid,customer_id",
  telemetry="stdout://5000?format=csv&publish=new"
}

header_1 {
  type="header://"
  removeRequest = ["host", "timeout-access"]  
}

header_2 {
  type="header://"
  removeRequest = ["host", "timeout-access"]
  addRequest = {
    "Content-Type" = "application/json"
  }
}

reject_2 {
  type="reject://"
  httpStatusCode=400
}

retry_2 {
  type="retry://"
  maxRetries=3
  delay=1000
}

cache_2 {
  type="cache://"
  strategy="cache"
  gc=60000
  ttl=5000
}

throttle_2 {
  type="throttle://"
  throttle=3000
  tps=2
}

# ===================================================================================
# EVM Proxy
# ===================================================================================
evm_1 {
  type="rpc3://"
  strategy="cache"
  gc=60000
  ttl=30000
  latest=12000
}

evm_2 {
  type="rpc3://"
  strategy="cache_async"
  gc=60000
  ttl=30000
  latest=12000
}

evm_3 {
  type="rpc3://"
  strategy="none"  
}

pool_evm_public_2 {
  type="pool://"
  strategy="sticky"
  destinations = [
    "https://ethereum-rpc.publicnode.com",
    "https://gateway.tenderly.co/public/mainnet"  
  ]
}

pool_evm_public_3 {
  type="pool://"
  #strategy="sticky"
  strategy="rr"
  destinations = [
    "https://ethereum-rpc.publicnode.com",
    "https://gateway.tenderly.co/public/mainnet",
    "https://rpc.ankr.com/eth"
  ]
}

# -----------------------------------------------------------------------
# Solana
# -----------------------------------------------------------------------
solana_1 {
  type="rpc3://"
  chain="solana"
  strategy="cache"
  ttl=30000
  latest=1000
  gc=15000
}

solana_2 {
  type="rpc3://"
  chain="solana"
  strategy="cache_async"
  ttl=30000
  latest=10000
  gc=15000
}

solana_3 {
  type="rpc3://"
  chain="solana"
  strategy="none"  
}

pool_4 {
  type="pool://"
  strategy="sticky"
  destinations = [
    "https://api.mainnet-beta.solana.com"
  ]
}

pool_solana {
  type="pool://"
  strategy="sticky"
  destinations = [
    ${?SOL_RPC_URL}
  ]
}

# ===================================================================================
# AI Router
# ===================================================================================
ai_router_1 {
  type="ai_router://"
  providers = {
    "openai" {
      uri="https://api.openai.com"
      api_key=${?OPENAI_API_KEY}
      api_key_header_name="Authorization"
      api_key_header_value="Bearer %s"
    }
    "claude" {
      uri="https://api.anthropic.com"
      api_key=${?CLAUDE_API_KEY}
      api_key_header_name="x-api-key"
      api_key_header_value="%s"
      headers {
        "anthropic-version" = "2023-06-01"
      }
    }
  }
}

# =========================================================================================
# Auth
# =========================================================================================
auth_1 {
  type="auth://"
  strategy="bearer"
  bearer {
    secret="1234"
  }
}

auth_2 {
  type="auth://"
  strategy="header"
  header {
    secret=${?HEADER_SECRET}
    name="x-api-key"
  }
}

# =========================================================================================
# =========================================================================================
# =========================================================================================
# =========================================================================================
# =========================================================================================
# Profiles
# =========================================================================================
profiles {
  ai_1 = {
    processors = "ai_token_1, ai_router_1, http_ai"
  }

  proxy = {
    processors = "proxy_1, http_proxy"
  }

  proxy_0 = {
    processors = "throttle_2, cache_2, pool_2, header_2, retry_2, http_2"
  }

  proxy_1 = {
    processors = "pool_1, http_2"
  }

  proxy_3 = {
    processors = "header_1, pool_1, retry_2, http_2"
  }

  rpc3 = {
    processors = "evm_1, pool_1, retry_2, http_2"
  }

  rpc3_ethereum = {
    processors = "auth_1, evm_2, pool_evm_public_2, retry_2, http_2"
  }

  rpc3_solana = {
    processors = "solana_2, pool_solana, retry_2, http_2"
  }
}


telemetry = "stdout://10000?format=csv"